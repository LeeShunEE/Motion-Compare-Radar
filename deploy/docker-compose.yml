# Docker Compose for Coolify/Production deployment
# radar-chart-rendering project
#
# Usage:
#   Coolify: Directly use this file (no override needed)
#   Manual: docker compose up -d
#
# Environment variables should be configured via Coolify UI or .env file

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-radar_chart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_chart}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # 资源限制（Coolify/部署环境覆盖，不填走默认）
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    # Coolify handles port exposure automatically
    # Uncomment for local debugging:
    # ports:
    #   - "5432:5432"

  # ============================================
  # Backend (FastAPI + SQLAlchemy)
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
      target: production
    environment:
      # Database connection (asyncpg for async SQLAlchemy)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radar_chart}
      # CORS settings
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # JWT configuration (CHANGE IN PRODUCTION!)
      JWT_SECRET_STRING: ${JWT_SECRET_STRING:?JWT_SECRET_STRING is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      JWT_REFRESH_EXPIRE_MINUTES: ${JWT_REFRESH_EXPIRE_MINUTES:-10080}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      # Storage configuration
      STORAGE_ROOT: /app/storage
      # Render worker configuration
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      WORKER_BASE_URL: http://render-worker:3100
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-600}
      # 进度回调共享密钥（与 render-worker 的 RENDER_CALLBACK_TOKEN 同值，防公网伪造）
      RENDER_CALLBACK_TOKEN_SECRET_STRING: ${RENDER_CALLBACK_TOKEN:?RENDER_CALLBACK_TOKEN is required}
      # Public assets path (frontend public directory mounted for asset listing)
      PUBLIC_ASSETS_PATH: /app/public_assets
      MAX_PUBLIC_ASSET_BYTES: ${MAX_PUBLIC_ASSET_BYTES:-104857600}
      # 背景媒体零拷贝（方案 B）：声明 worker 已将 backend_storage 只读挂载到其
      # publicDir/_user_media（见下方 render-worker volumes）。backend 据此直接产出
      # _user_media 相对路径而非复制进 _render_tmp。backend 与 worker 是不同容器，
      # 该挂载只在 worker，故 backend 必须经此 env 显式得知（不靠探测本地文件系统）。
      WORKER_USER_MEDIA_MOUNT: "true"
      # 零拷贝时 worker 静态服务器 URL（用于 serve _user_media 与 _render_tmp）。
      # Remotion bundle 在 bundle 时复制 public 文件夹，运行时新增文件不会被 serve。
      # Worker 添加了静态端点，backend 生成完整 HTTP URL 供 Remotion 组件使用。
      WORKER_STATIC_SERVER_URL: http://render-worker:3100
      # OAuth (optional)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET_SECRET_STRING: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET_SECRET_STRING: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI:-}
      # Email (optional)
      RESEND_API_KEY_SECRET_STRING: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    volumes:
      - backend_storage:/app/storage
      # Public assets are managed online by administrators and persist independently.
      - public_assets:/app/public_assets
      # Render tmp: writable subdir for silhouette rewrite (worker reads via staticFile)
      - render_tmp:/app/public_assets/_render_tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # 资源限制（Coolify/部署环境覆盖，不填走默认）
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.0}
    # Coolify handles port exposure automatically
    # Uncomment for local debugging:
    # ports:
    #   - "8000:8000"

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: ..
      dockerfile: ./deploy/frontend/Dockerfile
      target: production
      args:
        # NEXT_PUBLIC_API_URL is needed at build time for Next.js client-side code
        # Fallback to localhost for local builds; Coolify should override with real API URL
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
        # commit sha：Coolify build-time 环境自带 SOURCE_COMMIT；本地不传则空，
        # next.config.js 退化为 git describe / package.json 版本兜底
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      # Internal API URL (for server-side calls)
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      ADMIN_PATH_SECRET_STRING: ${ADMIN_PATH_SECRET_STRING:?ADMIN_PATH_SECRET_STRING is required}
    volumes:
      - public_assets:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:20-alpine 无 curl（render-worker 同理），用 busybox 自带 wget。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # 资源限制（生产 next start 内存占用稳定，Coolify/部署环境覆盖，不填走默认）
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    # Coolify handles port exposure automatically
    # Uncomment for local debugging:
    # ports:
    #   - "3000:3000"

  # ============================================
  # Render Worker (Remotion-based video rendering)
  # ============================================
  render-worker:
    build:
      context: ..
      dockerfile: ./deploy/render-worker/Dockerfile
      target: production
    environment:
      WORKER_PORT: 3100
      # 进度回调目标 + 共享密钥（与 backend 的 RENDER_CALLBACK_TOKEN_SECRET_STRING 同值）
      BACKEND_INTERNAL_URL: http://backend:8000
      RENDER_CALLBACK_TOKEN: ${RENDER_CALLBACK_TOKEN:?RENDER_CALLBACK_TOKEN is required}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - render_outputs:/app/output
      - backend_storage:/app/storage  # 共享 backend storage，让产物写入后可被 backend 读取
      - public_assets:/app/public:ro
      # Render tmp: shared with backend for silhouette rewrite temporary files
      # Mounted to public subdir so staticFile() can read them
      - render_tmp:/app/public/_render_tmp
      # 背景媒体零拷贝（方案 B）：只读复用 backend_storage 到 publicDir 子目录，
      # 让 staticFile() 经 _user_media/users/<uid>/uploads/<name> 直读上传原件，
      # 渲染端无需 copy 进 _render_tmp（见 silhouette_rewrite._try_rewrite 挂载分支）。
      - backend_storage:/app/public/_user_media:ro
    healthcheck:
      # 镜像（alpine + chromium/ffmpeg）未装 curl，但 busybox 自带 wget；
      # 用 curl 会让 healthcheck 永远 "curl: not found" 误报 unhealthy。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Remotion 合成器（OffthreadVideo 抽帧）依赖共享内存，Docker 默认 /dev/shm 仅 64MB，
    # 视频背景抽帧会击穿导致 Compositor SIGSEGV（图片/剪影渲染不触发）。放大到 1GB。
    shm_size: ${RENDER_WORKER_SHM_SIZE:-1gb}
    # 资源限制（渲染吃内存，默认给大些；Coolify/部署环境覆盖，不填走默认）
    mem_limit: ${RENDER_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${RENDER_WORKER_CPUS:-2.0}
    # Coolify handles port exposure automatically
    # Uncomment for local debugging:
    # ports:
    #   - "3100:3100"

# ============================================
# Volumes for persistent data
# ============================================
volumes:
  postgres_data:
    name: radar_postgres_data
  backend_storage:
    name: radar_backend_storage
  render_outputs:
    name: radar_render_outputs
  render_tmp:
    name: radar_render_tmp
  public_assets:
    name: radar_public_assets

# ============================================
# Network (optional, Coolify creates default)
# ============================================
networks:
  default:
    name: radar-network
