name: E2E Tests

on:
  # PRs run E2E by default. Repository rulesets decide whether this check blocks merging.
  pull_request:
    branches: [main]
  # 发版时触发：push 到 main 分支（合并 PR 后自动部署前）
  push:
    branches: [main]
  # 也支持手动触发，便于调试
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (testenv)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # 启动 testenv stack (backend + frontend + render-worker + db)
      - name: Start testenv stack
        run: |
          cd deploy
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml up -d
        env:
          # docker-compose.yml 要求必填的环境变量
          # dev override 使用 SQLite，但这些变量仍需设置以通过 docker compose 解析阶段
          POSTGRES_PASSWORD: devpass
          JWT_SECRET_STRING: ci-test-secret-not-for-production
          ADMIN_PATH_SECRET_STRING: radar-ci-operations-console
          RENDER_CALLBACK_TOKEN: ci-render-callback-token-not-for-production
          INITIAL_ADMIN_EMAIL: dev@test.com
          E2E_RESOURCE_PREFIX: radar-e2e-${{ github.run_id }}
          # CI runner 在欧洲/美国，访问阿里云镜像超时；覆盖为空走官方 PyPI
          PIP_INDEX: ''

      # Seed belongs to the test system and is written into the runtime volume,
      # never copied from the ignored frontend/public tree.
      - name: Seed public assets (testenv)
        run: |
          cd deploy
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml exec -T backend sh -c \
            'mkdir -p /app/public_assets/music && printf "fLaC" > /app/public_assets/music/sample-bgm.flac'
        env:
          POSTGRES_PASSWORD: devpass
          JWT_SECRET_STRING: ci-test-secret-not-for-production
          ADMIN_PATH_SECRET_STRING: radar-ci-operations-console
          RENDER_CALLBACK_TOKEN: ci-render-callback-token-not-for-production
          INITIAL_ADMIN_EMAIL: dev@test.com
          E2E_RESOURCE_PREFIX: radar-e2e-${{ github.run_id }}
          PIP_INDEX: ''

      # 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      # 设置 Node.js 环境
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 安装前端依赖（含 @playwright/test）
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # 安装 Playwright 浏览器（含系统依赖）
      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install chromium --with-deps

      # 等待服务完全就绪（backend + frontend）
      # dev stack: backend 暴露 18000:8000，frontend 暴露 13000:3000
      - name: Wait for services
        run: |
          echo "等待服务就绪..."
          for i in {1..30}; do
            backend_ready=$(curl -sf http://localhost:18000/api/v1/health > /dev/null && echo "ok" || echo "fail")
            frontend_ready=$(curl -sf http://localhost:13000/api/health > /dev/null && echo "ok" || echo "fail")
            if [ "$backend_ready" = "ok" ] && [ "$frontend_ready" = "ok" ]; then
              echo "所有服务就绪 ✓"
              exit 0
            fi
            echo "第 $i/30 次检查: backend=$backend_ready, frontend=$frontend_ready"
            sleep 5
          done
          echo "::error::服务在 150 秒后仍未就绪"
          # 输出日志便于排查
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml -f deploy/docker-compose.e2e.yml logs --tail=50
          exit 1
        env:
          POSTGRES_PASSWORD: devpass
          JWT_SECRET_STRING: ci-test-secret-not-for-production
          ADMIN_PATH_SECRET_STRING: radar-ci-operations-console
          RENDER_CALLBACK_TOKEN: ci-render-callback-token-not-for-production
          INITIAL_ADMIN_EMAIL: dev@test.com
          E2E_RESOURCE_PREFIX: radar-e2e-${{ github.run_id }}
          PIP_INDEX: ''

      # 运行 Playwright e2e 测试
      # 使用 NODE_PATH 让测试文件能从 frontend/node_modules 解析 @playwright/test
      - name: Run Playwright e2e tests
        run: |
          cd frontend
          pnpm exec playwright test --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:13000
          PLAYWRIGHT_API_URL: http://localhost:18000        # 后端地址，供 auth-helpers 取码
          PLAYWRIGHT_ADMIN_PATH: radar-ci-operations-console
          PLAYWRIGHT_ADMIN_USERNAME: dev
          PLAYWRIGHT_ADMIN_PASSWORD: dev12345
          # 让 Node.js 从 frontend/node_modules 解析模块（测试文件在 tests 目录下）
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules

      # 测试失败时 dump render-worker / backend 容器日志，便于诊断渲染崩溃。
      # 背景：Wait for services 通过后既有的 logs dump 分支不再触发，导致渲染类
      # e2e 失败时只能看到"下载超时"，看不到 worker 真实报错（SIGSEGV/OOM/option
      # 校验等）。worker 被强杀时 docker logs 仍会留下进程退出信号与 stderr。
      - name: Dump service logs on failure
        if: failure()
        run: |
          cd deploy
          echo "===== render-worker logs (tail 500) ====="
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml logs --tail=500 --no-color render-worker || true
          echo "===== backend logs (tail 200) ====="
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml logs --tail=200 --no-color backend || true
        env:
          POSTGRES_PASSWORD: devpass
          JWT_SECRET_STRING: ci-test-secret-not-for-production
          ADMIN_PATH_SECRET_STRING: radar-ci-operations-console
          RENDER_CALLBACK_TOKEN: ci-render-callback-token-not-for-production
          INITIAL_ADMIN_EMAIL: dev@test.com
          E2E_RESOURCE_PREFIX: radar-e2e-${{ github.run_id }}
          PIP_INDEX: ''

      # 上传测试结果（失败时保留报告）
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      # 清理 Docker 资源
      - name: Stop testenv stack
        if: always()
        run: cd deploy && docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml down -v
        env:
          POSTGRES_PASSWORD: devpass
          JWT_SECRET_STRING: ci-test-secret-not-for-production
          ADMIN_PATH_SECRET_STRING: radar-ci-operations-console
          RENDER_CALLBACK_TOKEN: ci-render-callback-token-not-for-production
          INITIAL_ADMIN_EMAIL: dev@test.com
          E2E_RESOURCE_PREFIX: radar-e2e-${{ github.run_id }}
          PIP_INDEX: ''
